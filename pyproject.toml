[project]
name = "qreduce"
version = "0.1.0"
description = ""
authors = [
    { name = "Alberto Trivellato", email = "alberto.trivellato@gmail.com" },
]
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = []

[dependency-groups]
dev = [
    "pytest (>=8.0)",
    "ruff (>=0.8)",
]
notebooks = [
    "ipykernel (>=6,<8)",
    "jupyterlab (>=4,<5)",
    "matplotlib (>=3.8,<4)",
    "pandas (>=2.2,<4)",
]
experiments = [
    "cplex (>=22.2.0.0,<23.0.0.0)",
    "dwave-samplers (>=1.7,<2)",
    "pyscipopt (>=5.0,<6.0)",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: exercises multiple QReduce components together.",
    "requires_cplex: requires the optional CPLEX binding and a usable license.",
    "requires_dwave_simulator: requires the optional dimod and dwave-samplers packages.",
]

[tool.ruff]
target-version = "py312"

[tool.poetry]
packages = [{ include = "qreduce", from = "src" }]
exclude = ["src/qreduce/experiments/**"]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"