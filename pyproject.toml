[project]
name = "qreduce"
version = "0.1.0"
description = ""
authors = [
    { name = "Alberto Trivellato", email = "alberto.trivellato@gmail.com" },
]
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = ["cplex (>=22.2.0.0,<23.0.0.0)"]

[dependency-groups]
dev = [
    "pytest (>=8.0)",
    "ruff (>=0.8)",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"

[tool.poetry]
packages = [{ include = "qreduce", from = "src" }]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"