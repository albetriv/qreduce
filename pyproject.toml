[project]
name = "qreduce"
version = "0.1.0"
description = ""
authors = [
    { name = "Alberto Trivellato", email = "alberto.trivellato@gmail.com" },
]
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "PyYAML (>=6.0,<7)",
]

[dependency-groups]
docs = [
    "mistune (==3.4.0)",
]
dev = [
    "pytest (>=8.0)",
    "ruff (>=0.8)",
]
notebooks = [
    "ipykernel (>=6,<8)",
    "jupyterlab (>=4,<5)",
    "matplotlib (>=3.8,<4)",
    "pandas (>=2.2,<4)",
]
experiments = [
    "pulser-simulation (==1.10.1)",
    "pasqal-cloud (>=0.24.0,<0.25.0)",
    "numpy (>=2,<3)",
    "cplex (>=22.2.0.0,<23.0.0.0)",
    "dwave-samplers (>=1.7,<2)",
    "pyscipopt (>=5.0,<6.0)",
    "dwave-graphs (>=1.3,<2)",
    "dwave-samplers (>=1.7,<2)",
    "dwave-system (>=1.20,<2)",
    "minorminer (>=0.2.15,<1)",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: exercises multiple QReduce components together.",
    "requires_cplex: requires the optional CPLEX binding and a usable license.",
    "requires_dwave_simulator: requires the optional dimod and dwave-samplers packages.",
    "requires_dwave_embedding: requires the optional dwave-embedding group (dwave-system, minorminer).",
]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
# Mantiene le regole predefinite (E, F) e aggiunge gradualmente le regole pydocstyle.
# Le regole D sono attivate progressivamente per evitare docstring cosmetiche.
# E501 (line too long) è ignorata per mantenere il comportamento precedente.
extend-select = [
    "D100",  # Docstring nei moduli pubblici
    "D101",  # Docstring nelle classi pubbliche
    "D102",  # Docstring nei metodi pubblici
    "D103",  # Docstring nelle funzioni pubbliche
    "D107",  # Docstring nei __init__ (consigliato, non obbligatorio nei test)
    "D200",  # One-line docstrings su una riga
    "D201",  # Nessuna riga vuota prima della docstring
    "D202",  # Nessuna riga vuota dopo la docstring
    "D205",  # 1 blank line required between summary and description
    "D210",  # No whitespace around docstring text
    "D300",  # Usa """triple double quotes"""
    "D400",  # La prima riga termina con un punto
    "D401",  # Prima riga in imperativo (inglese)
    "D403",  # Prima riga non inizia con "This"
]
ignore = [
    "E501",  # Line too long - non era controllata precedentemente
]

[tool.ruff.lint.per-file-ignores]
# Test: non richiedere docstring per funzioni test e helper di test
"tests/**/*.py" = ["D100", "D101", "D102", "D103", "D107", "D401"]
# __init__.py: spesso solo export, non richiedere docstring se banali
"**/__init__.py" = ["D104"]
# Esperimenti: moduli interni (non adapter) hanno docstring meno stringenti
# Gli adapter implementano ReducibleProblemAdapter e sono documentati
"src/qreduce/experiments/**/models.py" = ["D101", "D102", "D103", "D107"]
"src/qreduce/experiments/**/formulation.py" = ["D101", "D102", "D103", "D107"]
"src/qreduce/experiments/**/datasets.py" = ["D101", "D102", "D103", "D107"]
"src/qreduce/experiments/**/postcheck.py" = ["D101", "D102", "D103", "D107"]
"src/qreduce/experiments/**/analysis.py" = ["D101", "D102", "D103", "D107"]
"src/qreduce/experiments/**/benchmark.py" = ["D101", "D102", "D103", "D107"]
"src/qreduce/experiments/**/run.py" = ["D101", "D102", "D103", "D107"]
"src/qreduce/experiments/**/graph_policy.py" = ["D101", "D102", "D103", "D107"]
"src/qreduce/experiments/**/inputs.py" = ["D101", "D102", "D103", "D107"]
# Moduli interni multi-round: docstring interne meno critiche
"src/qreduce/pipeline/multi_round.py" = ["D401"]
# Contratti con pattern to_dict ripetitivo: il contratto comune è documentato nel modulo
# Questi metodi implementano un'interfaccia di serializzazione uniforme
"src/qreduce/domains/contracts.py" = ["D102"]
"src/qreduce/solving/mwis/contracts.py" = ["D102"]
"src/qreduce/solving/mwis/audit.py" = ["D102"]
"src/qreduce/solving/mwis/presolve.py" = ["D102"]
"src/qreduce/solving/mwis/pulse_strategy.py" = ["D102"]
"src/qreduce/solving/mwis/completion.py" = ["D102"]
"src/qreduce/solving/mwis/geometry_diagnostics.py" = ["D102"]
"src/qreduce/solving/residual/contracts.py" = ["D102"]
"src/qreduce/pipeline/single_pass.py" = ["D102"]
"src/qreduce/solving/residual/model.py" = ["D102"]
# Registry: pattern builder con contratto comune documentato sulla classe
"src/qreduce/solving/mwis/registry.py" = ["D102", "D107"]
"src/qreduce/solving/residual/registry.py" = ["D102", "D107"]
# MWISValidationError: eccezione con __init__ semplice
"src/qreduce/mwis/validation.py" = ["D107"]
# Notebook: E402 (import not at top) è comune nei notebook dopo magic commands
"notebooks/**/*.ipynb" = ["E402"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.poetry]
packages = [{ include = "qreduce", from = "src" }]
exclude = ["src/qreduce/experiments/**"]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"